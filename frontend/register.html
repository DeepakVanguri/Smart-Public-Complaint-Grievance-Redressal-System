<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SmartGov</title>
    <link rel="stylesheet" href="/static/css/styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background: var(--bg);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 40px 20px 60px;
        }

        .auth-bg-glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .glow1 {
            width: 500px;
            height: 500px;
            background: rgba(59, 130, 246, 0.08);
            top: -100px;
            right: -100px;
        }

        .glow2 {
            width: 400px;
            height: 400px;
            background: rgba(16, 185, 129, 0.06);
            bottom: -80px;
            left: -80px;
        }

        .auth-container {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 1;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            width: 60px;
            height: 60px;
            background: var(--gradient-primary);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 16px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        .auth-card {
            background: var(--surface);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-xl);
            padding: 40px;
        }

        .form-row {
            display: grid;
            gap: 16px;
        }

        .form-row-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .role-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .role-option {
            border: 2px solid var(--card-border);
            border-radius: var(--radius);
            padding: 14px 8px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
        }

        .role-option:hover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.05);
        }

        .role-option.selected {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
            color: var(--primary-light);
        }

        .role-option input {
            display: none;
        }

        .role-icon {
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .role-name {
            font-size: 0.8rem;
            font-weight: 600;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            transition: all var(--transition-slow);
        }

        @media(max-width:480px) {
            .form-row-2col {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="auth-bg-glow glow1"></div>
    <div class="auth-bg-glow glow2"></div>

    <div class="auth-container fade-in">
        <div class="auth-header">
            <div class="auth-logo">🏛️</div>
            <h2>Create Account</h2>
            <p style="font-size:0.9rem; margin-top:4px">Join SmartGov and start resolving civic issues</p>
        </div>

        <div class="auth-card">
            <div id="error-alert" class="alert alert-error hidden" style="margin-bottom:16px">
                <span>❌</span><span id="error-msg"></span>
            </div>
            <div id="success-alert" class="alert alert-success hidden" style="margin-bottom:16px">
                <span>✅</span><span id="success-msg"></span>
            </div>

            <form id="register-form" class="form-row">
                <!-- Role Selection -->
                <div class="form-group">
                    <label class="form-label">Select Your Role</label>
                    <div class="role-selector">
                        <label class="role-option selected" id="role-citizen">
                            <input type="radio" name="role" value="citizen" checked>
                            <div class="role-icon">👤</div>
                            <div class="role-name">Citizen</div>
                            <div style="font-size:0.7rem; color:var(--text-muted)">Report Issues</div>
                        </label>
                        <label class="role-option" id="role-staff">
                            <input type="radio" name="role" value="staff">
                            <div class="role-icon">⚙️</div>
                            <div class="role-name">Staff</div>
                            <div style="font-size:0.7rem; color:var(--text-muted)">Resolve Issues</div>
                        </label>
                        <label class="role-option" id="role-admin">
                            <input type="radio" name="role" value="admin">
                            <div class="role-icon">🛡️</div>
                            <div class="role-name">Admin</div>
                            <div style="font-size:0.7rem; color:var(--text-muted)">Manage All</div>
                        </label>
                    </div>
                </div>

                <div class="form-row-2col">
                    <div class="form-group">
                        <label class="form-label">Full Name *</label>
                        <input id="full_name" type="text" class="form-input" placeholder="Ravi Kumar" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Phone Number *</label>
                        <input id="phone" type="tel" class="form-input" placeholder="9876543210" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address *</label>
                    <div class="input-icon-wrap">
                        <span class="icon">📧</span>
                        <input id="email" type="email" class="form-input" placeholder="you@example.com" required>
                    </div>
                </div>

                <!-- Department (for staff/admin) -->
                <div class="form-group" id="dept-group" style="display:none">
                    <label class="form-label">Department *</label>
                    <select id="department" class="form-select">
                        <option value="">Select Department</option>
                        <option value="Water Supply">💧 Water Supply</option>
                        <option value="Electricity">⚡ Electricity</option>
                        <option value="Sanitation">🗑️ Sanitation</option>
                        <option value="Infrastructure">🏗️ Infrastructure</option>
                        <option value="Administration">🏛️ Administration</option>
                    </select>
                </div>

                <div class="form-row-2col">
                    <div class="form-group">
                        <label class="form-label">Password *</label>
                        <input id="password" type="password" class="form-input" placeholder="Min. 6 characters" required
                            oninput="checkStrength(this.value)">
                        <div id="strength-bar" class="password-strength" style="background:var(--surface-2)"></div>
                        <div id="strength-text" class="form-hint" style="margin-top:2px"></div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Confirm Password *</label>
                        <input id="confirm_password" type="password" class="form-input" placeholder="Repeat password"
                            required>
                    </div>
                </div>

                <div style="display:flex; align-items:flex-start; gap:10px; padding:4px 0">
                    <input type="checkbox" id="agree" required style="margin-top:3px; accent-color:var(--primary)">
                    <label for="agree" style="font-size:0.85rem; color:var(--text-muted); cursor:pointer">I agree to the
                        Terms of Service and Privacy Policy of SmartGov</label>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg" id="reg-btn">
                    <span id="reg-btn-text">Create Account</span>
                </button>
            </form>

            <div style="text-align:center; margin-top:20px">
                <span style="font-size:0.875rem; color:var(--text-muted)">Already have an account? </span>
                <a href="/static/login.html" style="font-weight:600">Sign In →</a>
            </div>
        </div>
        <p style="text-align:center; margin-top:16px; font-size:0.85rem; color:var(--text-muted)">
            <a href="/static/index.html">← Back to Home</a>
        </p>
    </div>

    <div id="toast-container" class="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script>
        // Redirect if already logged in — run after DOM ready so app.js is loaded
        document.addEventListener('DOMContentLoaded', () => {
            if (Auth.isLoggedIn()) Utils.redirectDashboard();
        });

        // Role selection UX
        document.querySelectorAll('input[name="role"]').forEach(radio => {
            radio.addEventListener('change', function () {
                document.querySelectorAll('.role-option').forEach(r => r.classList.remove('selected'));
                this.closest('.role-option').classList.add('selected');
                const nonCitizen = this.value !== 'citizen';
                document.getElementById('dept-group').style.display = nonCitizen ? 'flex' : 'none';
                if (!nonCitizen) document.getElementById('department').removeAttribute('required');
                else document.getElementById('department').setAttribute('required', '');
            });
        });

        // Password strength checker
        function checkStrength(pass) {
            const bar = document.getElementById('strength-bar');
            const txt = document.getElementById('strength-text');
            if (!pass) { bar.style.background = 'var(--surface-2)'; bar.style.width = '0%'; txt.textContent = ''; return; }
            let score = 0;
            if (pass.length >= 6) score++;
            if (pass.length >= 10) score++;
            if (/[A-Z]/.test(pass)) score++;
            if (/[0-9]/.test(pass)) score++;
            if (/[^A-Za-z0-9]/.test(pass)) score++;
            const levels = [
                { label: 'Too Weak', color: 'var(--danger)', width: '20%' },
                { label: 'Weak', color: 'var(--warning)', width: '40%' },
                { label: 'Fair', color: 'var(--warning)', width: '60%' },
                { label: 'Good', color: 'var(--success)', width: '80%' },
                { label: 'Strong 💪', color: 'var(--success)', width: '100%' },
            ];
            const level = levels[Math.min(score, 4)];
            bar.style.background = level.color;
            bar.style.width = level.width;
            txt.textContent = level.label;
            txt.style.color = level.color;
        }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            const btnText = document.getElementById('reg-btn-text');
            const errorAlert = document.getElementById('error-alert');
            const errorMsg = document.getElementById('error-msg');

            errorAlert.classList.add('hidden');

            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            if (password !== confirm) {
                errorMsg.textContent = 'Passwords do not match';
                errorAlert.classList.remove('hidden');
                return;
            }

            const role = document.querySelector('input[name="role"]:checked').value;
            const dept = document.getElementById('department').value;
            if (role !== 'citizen' && !dept) {
                errorMsg.textContent = 'Please select a department';
                errorAlert.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px"></span> Creating account...';

            try {
                const data = await API.register({
                    full_name: document.getElementById('full_name').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password,
                    role,
                    department: dept || null
                });
                Auth.save(data.token, data.user);
                Toast.success('Account created successfully! 🎉');
                setTimeout(() => Utils.redirectDashboard(), 1000);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorAlert.classList.remove('hidden');
                btn.disabled = false;
                btnText.textContent = 'Create Account';
            }
        });
    </script>
</body>

</html>
